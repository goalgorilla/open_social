services:
  Drupal\social_analytics\Hooks\IndividualMetricsUserFormAlter:
    class: Drupal\social_analytics\Hooks\IndividualMetricsUserFormAlter
    factory: ['Drupal\social_analytics\Hooks\IndividualMetricsUserFormAlter', 'create']
    arguments: ['@service_container']
    tags:
      - { name: hooks }

  social_analytics.individual_metrics_preference:
    class: Drupal\social_analytics\IndividualMetricsPreferenceService
    arguments:
      - '@user.data'
      - '@config.factory'

  social_analytics.eda_handler:
    class: Drupal\social_analytics\EdaHandler
    arguments:
      - '@uuid'
      - '@request_stack'
      - '@current_user'
      - '@current_route_match'
      - '@config.factory'
      - '@datetime.time'
      - '@logger.factory'
      - '@?social_eda.dispatcher'
    tags:
      - { name: social.eda.handler }

  social_analytics.page_view_subscriber:
    class: Drupal\social_analytics\EventSubscriber\PageViewSubscriber
    arguments:
      - '@social_analytics.eda_handler'
      - '@current_user'
    tags:
      - { name: event_subscriber }
