services:
  _defaults:
    autowire: true

  Drupal\social_analytics\Hooks\IndividualMetricsUserFormAlter:
    class: Drupal\social_analytics\Hooks\IndividualMetricsUserFormAlter
    factory: ['Drupal\social_analytics\Hooks\IndividualMetricsUserFormAlter', 'create']
    arguments: ['@service_container']
    tags:
      - { name: hooks }

  social_analytics.individual_metrics_preference:
    class: Drupal\social_analytics\IndividualMetricsPreferenceService
  Drupal\social_analytics\IndividualMetricsPreferenceService: '@social_analytics.individual_metrics_preference'

  social_analytics.individual_metrics_eda_handler:
    class: Drupal\social_analytics\IndividualMetricsEdaHandler
    bind:
      $dispatcher: '@?social_eda.dispatcher'
  Drupal\social_analytics\IndividualMetricsEdaHandler: '@social_analytics.individual_metrics_eda_handler'

  social_analytics.analytics_settings_eda_handler:
    class: Drupal\social_analytics\AnalyticsSettingsEdaHandler
    bind:
      $dispatcher: '@?social_eda.dispatcher'
  Drupal\social_analytics\AnalyticsSettingsEdaHandler: '@social_analytics.analytics_settings_eda_handler'

  social_analytics.eda_handler:
    class: Drupal\social_analytics\EdaHandler
    bind:
      $dispatcher: '@?social_eda.dispatcher'
    tags:
      - { name: social.eda.handler }
  Drupal\social_analytics\EdaHandler: '@social_analytics.eda_handler'

  social_analytics.page_view_subscriber:
    class: Drupal\social_analytics\EventSubscriber\PageViewSubscriber
    arguments:
      - '@social_analytics.eda_handler'
      - '@current_user'
    tags:
      - { name: event_subscriber }
  Drupal\social_analytics\EventSubscriber\PageViewSubscriber: '@social_analytics.page_view_subscriber'
