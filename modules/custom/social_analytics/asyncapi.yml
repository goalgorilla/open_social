channels:
  pageView:
    address: com.getopensocial.cms.page_view
    messages:
      pageView:
        payload:
          allOf:
            - $ref: '#/components/schemas/cloudEventsSchema'
            - type: object
              properties:
                data:
                  type: object
                  properties:
                    url:
                      type: string
                      format: uri
                      description: The full URL being visited (including domain and parameters).
                    target:
                      type: array
                      nullable: true
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            description: The UUID of the target entity.
                          type:
                            type: string
                            description: The type of the target entity.
                          href:
                            $ref: '#/components/schemas/Common.Href'
                    actor:
                      $ref: '#/components/schemas/Common.Actor'

operations:
  onPageView:
    action: 'receive'
    channel:
      $ref: '#/channels/pageView'
