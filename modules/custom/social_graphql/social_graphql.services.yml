services:
  Drupal\social_graphql\SchemaExtensionDependencyFilter:
    class: Drupal\social_graphql\SchemaExtensionDependencyFilter
    arguments:
      - '@module_handler'
      - '@theme_handler'
      - '@config.factory'
  social_graphql.schema_extension_dependency_filter: '@Drupal\social_graphql\SchemaExtensionDependencyFilter'

  logger.channel.social_graphql:
    parent: logger.channel_base
    arguments: ['social_graphql']

  logger.channel.social_graphql_audit:
    parent: logger.channel_base
    arguments: ['social_graphql.audit']

  social_graphql.request_logger:
    class: Drupal\social_graphql\EventSubscriber\GraphqlAuditSubscriber
    arguments: ['@logger.channel.social_graphql', '@logger.channel.social_graphql_audit', '@current_user']
    tags:
      - { name: event_subscriber }
