services:
  logger.channel.social_graphql:
    parent: logger.channel_base
    arguments: ['social_graphql']

  logger.channel.social_graphql_audit:
    parent: logger.channel_base
    arguments: ['social_graphql.audit']

  social_graphql.request_logger:
    class: Drupal\social_graphql\EventSubscriber\GraphqlAuditSubscriber
    arguments: ['@logger.channel.social_graphql', '@logger.channel.social_graphql_audit', '@current_user']
    tags:
      - { name: event_subscriber }
