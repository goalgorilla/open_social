"graphql:use":
  description: 'Allows consumers with this scope to use graphql'
  umbrella: false
  grant_types:
    client_credentials:
      status: true
      description: 'Allow API users to use graphql'
    authorization_code:
      status: true
      description: 'Allow API users to use graphql'
    refresh_token:
      status: true
      description: 'Allow refreshing access to the GraphQL API.'
  granularity: permission
  permission: 'execute open_social_graphql arbitrary graphql requests'

"graphql:staged_upload:create":
  description: 'Allows consumers to create a staged file upload request using Tus.'
  umbrella: false
  grant_types:
    client_credentials:
      status: true
      description: 'Allow the application to upload files.'
    authorization_code:
      status: true
      description: 'Allow the application to upload files.'
  granularity: permissions
  permissions: []
