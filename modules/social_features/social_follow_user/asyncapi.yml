channels:
  followUserCreate:
    address: com.getopensocial.cms.follow.v1
    messages:
      followUserCreate:
        payload:
          allOf:
            - $ref: '#/components/schemas/cloudEventsSchema'
            - type: object
              properties:
                type:
                  type: string
                  const: com.getopensocial.cms.follow.user.create
                data:
                  type: object
                  properties:
                    follow:
                      type: object
                      properties:
                        id:
                          type: string
                          description: The UUID of the follow relationship.
                        created:
                          type: string
                          format: date-time
                          description: The creation time of the follow relationship.
                        updated:
                          type: string
                          format: date-time
                          description: The last updated time of the follow relationship.
                        target:
                          allOf:
                            - $ref: '#/components/schemas/Common.UserRef'
                          description: The target user reference.
                        follower:
                          allOf:
                            - $ref: '#/components/schemas/Common.UserRef'
                          description: The follower reference.
                    actor:
                      type: object
                      properties:
                        application:
                          type: object
                          nullable: true
                          properties:
                            id:
                              type: string
                              description: Application ID (UUIDv4)
                            name:
                              type: string
                              description: Name of the application
                        user:
                          allOf:
                            - $ref: '#/components/schemas/Common.UserRef'
                          nullable: true
                          description: The actor user reference.
  followUserDelete:
    address: com.getopensocial.cms.follow.v1
    messages:
      followUserDelete:
        payload:
          allOf:
            - $ref: '#/components/schemas/cloudEventsSchema'
            - type: object
              properties:
                type:
                  type: string
                  const: com.getopensocial.cms.follow.user.delete
                data:
                  type: object
                  properties:
                    follow:
                      type: object
                      properties:
                        id:
                          type: string
                          description: The UUID of the follow relationship.
                        created:
                          type: string
                          format: date-time
                          description: The creation time of the follow relationship.
                        updated:
                          type: string
                          format: date-time
                          description: The last updated time of the follow relationship.
                        target:
                          allOf:
                            - $ref: '#/components/schemas/Common.UserRef'
                          description: The target user reference.
                        follower:
                          allOf:
                            - $ref: '#/components/schemas/Common.UserRef'
                          description: The follower reference.
                    actor:
                      type: object
                      properties:
                        application:
                          type: object
                          nullable: true
                          properties:
                            id:
                              type: string
                              description: Application ID (UUIDv4)
                            name:
                              type: string
                              description: Name of the application
                        user:
                          allOf:
                            - $ref: '#/components/schemas/Common.UserRef'
                          nullable: true
                          description: The actor user reference.
operations:
  onFollowUserCreate:
    action: 'receive'
    channel:
      $ref: '#/channels/followUserCreate'
  onFollowUserDelete:
    action: 'receive'
    channel:
      $ref: '#/channels/followUserDelete'
