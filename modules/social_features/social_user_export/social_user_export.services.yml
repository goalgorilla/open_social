services:
  plugin.manager.user_export_plugin:
    class: Drupal\social_user_export\Plugin\UserExportPluginManager
    arguments:
      - '@container.namespaces'
      - '@cache.discovery'
      - '@module_handler'
      - '@theme_handler'
      - '@config.factory'

  logger.channel.social_user_export:
    parent: logger.channel_base
    arguments: ['social_user_export']

  social_user_export.route_subscriber:
    class: Drupal\social_user_export\Routing\RouteSubscriber
    arguments:
      - '@entity_type.manager'
    tags:
      - { name: event_subscriber }

  social_user_export.user_export:
    class: Drupal\social_user_export\UserExportService
    arguments:
      - '@plugin.manager.user_export_plugin'
      - '@current_user'
      - '@config.factory'
      - '@file_url_generator'
      - '@file.repository'
      - '@messenger'
      - '@logger.channel.social_user_export'
      - '@module_handler'
      - '@file_system'
      - '@entity_type.manager'
