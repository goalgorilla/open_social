                        collapsible_disable_automatic_open: false
                        is_secondary: false
                        hide_label: false
                    field_group_type_target_id:
                      plugin_id: default
                      advanced:
                        sort_options: false
                        rewrite:
                          filter_rewrite_values: ''
                          filter_rewrite_values_key: false
