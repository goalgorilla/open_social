                field: created
                relationship: none
                group_type: group
                admin_label: ''
                entity_type: group
                entity_field: created
                plugin_id: date
                order: DESC
                expose:
                  label: 'Created'
                  field_identifier: created
                exposed: true
                granularity: second
              label:
                id: label
                table: groups_field_data
                field: label
                relationship: none
                group_type: group
                admin_label: ''
                entity_type: group
                entity_field: label
                plugin_id: standard
                order: ASC
                expose:
