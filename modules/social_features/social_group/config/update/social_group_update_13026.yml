                  enabled: false
                  options:
                    sort:
                      root:
                        container_type: details
                        depth: '0'
                        description: ''
                        id: root
                        open: true
                        pid: ''
                        title: Filters
                        type: container
                        weight: '0'
                      sort_by:
                        depth: '1'
                        id: sort_by
                        pid: root
                        type: sort
                        weight: '-11'
                      field_group_allowed_join_method_value:
                        depth: '1'
                        id: field_group_allowed_join_method_value
                        pid: root
                        type: filter
                        weight: '-10'
                      field_group_type_target_id:
                        depth: '1'
                        id: field_group_type_target_id
                        pid: root
                        type: filter
                        weight: '-10'
                      submit:
