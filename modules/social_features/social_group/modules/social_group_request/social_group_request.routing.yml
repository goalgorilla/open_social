social_group_request.settings:
  path: '/admin/config/opensocial/social-group-request'
  defaults:
    _form: '\Drupal\social_group_request\Form\GroupRequestSettingsForm'
    _title: 'Hubs request to join settings'
  requirements:
    _permission: 'set social group settings'

social_group_request.anonymous_request_membership:
  path: '/group/{group}/anonymous-request-membership'
  defaults:
    _controller: '\Drupal\social_group_request\Controller\GroupRequestController::anonymousRequestMembership'
  requirements:
    _access: 'TRUE'
  options:
    parameters:
      group:
        type: 'entity:group'

social_group_request.cancel_request:
  path: '/group/{group}/cancel-request'
  defaults:
    _controller: '\Drupal\social_group_request\Controller\GroupRequestController::cancelRequest'
  requirements:
    _group_permission: 'request group membership'
    _group_member: 'FALSE'
    _csrf_token: 'TRUE'
  options:
    parameters:
      group:
        type: 'entity:group'
