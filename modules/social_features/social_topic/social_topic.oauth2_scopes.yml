# Topic scopes for GraphQL API access
"topic":
  description: 'Provides access to all topic data on the platform.'
  umbrella: true
  grant_types:
    authorization_code:
      status: true
      description: 'Allow the application to read and write any topic information you have access to.'
    client_credentials:
      status: true
      description: 'Allow the application to read and write any topic information on the platform.'

"topic:write":
  parent: topic
  description: 'Provides the ability to create and update topics on the platform.'
  umbrella: false
  granularity: permissions
  permissions:
    - scope: drupal
      permission: 'create topic content'
    - scope: drupal
      permission: 'edit any topic content'
    - scope: drupal
      permission: 'delete any topic content'
    - scope: outsider
      identifier: flexible_group
      permission: 'create group_node:topic entity'
    - scope: outsider
      identifier: flexible_group
      permission: 'create group_node:topic relationship'
    - scope: outsider
      identifier: flexible_group
      permission: 'update any group_node:topic entity'
    - scope: outsider
      identifier: flexible_group
      permission: 'update any group_node:topic relationship'
    - scope: outsider
      identifier: flexible_group
      permission: 'delete any group_node:topic entity'
    - scope: outsider
      identifier: flexible_group
      permission: 'delete any group_node:topic relationship'
    - scope: drupal
      permission: 'use text format basic_html'
    - scope: drupal
      permission: 'select terms in topic_types'
    - scope: drupal
      permission: 'select terms in social_tagging'
  grant_types:
    authorization_code:
      status: true
      description: 'Allow the application to create, update, and delete topics you have access to.'
    client_credentials:
      status: true
      description: 'Allow the application to create, update, and delete any topic on the platform.'

"topic:read":
  parent: topic:write
  description: 'Provides the ability to read topics on the platform.'
  umbrella: false
  granularity: permissions
  permissions:
    - scope: drupal
      permission: 'access content'
    - scope: drupal
      permission: 'view terms in topic_types'
    - scope: drupal
      permission: 'view terms in social_tagging'
  grant_types:
    authorization_code:
      status: true
      description: 'Allow the application to read any topic information you have access to.'
    client_credentials:
      status: true
      description: 'Allow the application to read any topic information on the platform.'
