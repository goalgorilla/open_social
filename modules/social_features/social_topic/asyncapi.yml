channels:
  topicCreate:
    address: com.getopensocial.cms.topic.v1
    messages:
      topicCreate:
        payload:
          allOf:
            - $ref: '#/components/schemas/cloudEventsSchema'
            - type: object
              properties:
                type:
                  type: string
                  const: com.getopensocial.cms.topic.create
                data:
                  type: object
                  properties:
                    topic:
                      type: object
                      properties:
                        id:
                          type: string
                          description: The UUID of the topic.
                        created:
                          type: string
                          format: date-time
                          description: The creation time of the topic.
                        updated:
                          type: string
                          format: date-time
                          description: The last updated time of the topic.
                        status:
                          type: string
                          description: The status of the topic.
                          enum:
                            - published
                            - unpublished
                        label:
                          type: string
                          description: The label of the topic.
                        visibility:
                          type: object
                          properties:
                            type:
                              type: string
                              description: The visibility type.
                            groups:
                              type: array
                              description: The list of groups (only applicable for "groups" visibility).
                            roles:
                              type: array
                              description: The list of roles (only applicable for "roles" visibility).
                        type:
                          type: string
                          nullable: true
                          description: The type of the topic.
                        group:
                          type: object
                          nullable: true
                          properties:
                            id:
                              type: string
                              description: The UUID of the group.
                            label:
                              type: string
                              description: The label of the group.
                            href:
                              $ref: '#/components/schemas/Common.Href'
                        author:
                          type: object
                          properties:
                            id:
                              type: string
                              description: The UUID of the author.
                            displayName:
                              type: string
                              description: The display name of the author.
                            href:
                              $ref: '#/components/schemas/Common.Href'
                        href:
                          $ref: '#/components/schemas/Common.Href'
                    actor:
                      type: object
                      properties:
                        application:
                          type: object
                          nullable: true
                          properties:
                            id:
                              type: string
                              description: Application ID (UUIDv4)
                            name:
                              type: string
                              description: Name of the application
                        user:
                          type: object
                          nullable: true
                          properties:
                            id:
                              type: string
                              description: Actor user ID (UUIDv4)
                            displayName:
                              type: string
                              description: Display name of the actor user
                            href:
                              $ref: '#/components/schemas/Common.Href'
