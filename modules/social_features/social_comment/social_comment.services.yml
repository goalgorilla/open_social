services:
  _defaults:
    autowire: true

  social_comment.hidden_comment_field_map_cache:
    class: Drupal\social_comment\Cache\HiddenCommentFieldMapCache
    arguments:
      - '@cache.data'
      - '@entity_type.manager'
      - '@entity_field.manager'
  Drupal\social_comment\Cache\HiddenCommentFieldMapCache: '@social_comment.hidden_comment_field_map_cache'
  access_policy.social_comment.hidden_comment_node_owner:
    class: Drupal\social_comment\Access\HiddenCommentNodeOwnerAccessPolicy
    tags:
      - { name: access_policy }
  social_comment.hidden_comment_field_access:
    class: Drupal\social_comment\HiddenCommentFieldAccess
  Drupal\social_comment\HiddenCommentFieldAccessInterface: '@social_comment.hidden_comment_field_access'
  social_comment.breadcrumb:
    arguments: ['@entity_type.manager']
    class: Drupal\social_comment\SocialCommentBreadcrumbBuilder
    tags:
      - { name: breadcrumb_builder, priority: 101 }
  social_comment.route_subscriber:
    class: Drupal\social_comment\Routing\RouteSubscriber
    arguments: ['@config.factory']
    tags:
      - { name: event_subscriber }
  social_comment.lazy_renderer:
    class: Drupal\social_comment\SocialCommentLazyRenderer
    arguments:
      - '@entity_type.manager'
      - '@current_route_match'
      - '@module_handler'
  social_comment.eda_handler:
    class: Drupal\social_comment\EdaHandler
    arguments:
      - '@request_stack'
      - '@module_handler'
      - '@current_user'
      - '@current_route_match'
      - '@config.factory'
      - '@datetime.time'
      - '@logger.factory'
      - '@?social_eda.dispatcher'
    tags:
      - { name: social.eda.handler }

  social_comment.hidden_comment_field_cache_invalidation.hooks:
    class: Drupal\social_comment\Hooks\HiddenCommentFieldCacheInvalidationHooks
    autowire: true
    arguments:
      $accessPolicyMemoryCache: '@cache.access_policy_memory'
    tags:
      - { name: hooks }
  Drupal\social_comment\Hooks\HiddenCommentFieldCacheInvalidationHooks: '@social_comment.hidden_comment_field_cache_invalidation.hooks'
