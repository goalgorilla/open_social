channels:
  likeCreate:
    address: com.getopensocial.cms.like.v1
    messages:
      likeCreate:
        payload:
          allOf:
            - $ref: '#/components/schemas/cloudEventsSchema'
            - type: object
              properties:
                type:
                  type: string
                  const: com.getopensocial.cms.like.create
                data:
                  type: object
                  properties:
                    like:
                      type: object
                      properties:
                        id:
                          type: string
                          description: The UUID of the like.
                        created:
                          type: string
                          format: date-time
                          description: The creation time of the like.
                        updated:
                          type: string
                          format: date-time
                          description: The last updated time of the like.
                        target:
                          $ref: '#/components/schemas/Common.TargetRef'
                        user:
                          allOf:
                            - $ref: '#/components/schemas/Common.UserRef'
                          description: The user who liked reference.
                    actor:
                      $ref: '#/components/schemas/Common.Actor'
  likeDelete:
    address: com.getopensocial.cms.like.v1
    messages:
      likeDelete:
        payload:
          allOf:
            - $ref: '#/components/schemas/cloudEventsSchema'
            - type: object
              properties:
                type:
                  type: string
                  const: com.getopensocial.cms.like.delete
                data:
                  type: object
                  properties:
                    like:
                      type: object
                      properties:
                        id:
                          type: string
                          description: The UUID of the like.
                        created:
                          type: string
                          format: date-time
                          description: The creation time of the like.
                        updated:
                          type: string
                          format: date-time
                          description: The last updated time of the like.
                        target:
                          $ref: '#/components/schemas/Common.TargetRef'
                        user:
                          allOf:
                            - $ref: '#/components/schemas/Common.UserRef'
                          description: The user who liked reference.
                    actor:
                      $ref: '#/components/schemas/Common.Actor'
operations:
  onLikeCreate:
    action: 'receive'
    channel:
      $ref: '#/channels/likeCreate'
  onLikeDelete:
    action: 'receive'
    channel:
      $ref: '#/channels/likeDelete'
