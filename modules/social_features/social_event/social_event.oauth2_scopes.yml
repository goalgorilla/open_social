# Event scopes for GraphQL API access
"event":
  description: 'Provides access to all Event data on the platform.'
  umbrella: true
  grant_types:
    authorization_code:
      status: true
      description: 'Allow the application to read, write and delete any Event information you have access to.'
    client_credentials:
      status: true
      description: 'Allow the application to read, write and delete any Event information on the platform.'

"event:write":
  parent: event
  description: 'Provides the ability to create, update and delete events on the platform.'
  umbrella: false
  granularity: permission
  permission: 'create event content'
  grant_types:
    authorization_code:
      status: true
      description: 'Allow the application to read, write and delete any Event information you have access to.'
    client_credentials:
      status: true
      description: 'Allow the application to read, write and delete any Event information on the platform.'

"event:read":
  parent: event:write
  description: 'Provides the ability to read events on the platform.'
  umbrella: false
  granularity: 'permission'
  permission: 'access content'
  grant_types:
    authorization_code:
      status: true
      description: 'Allow the application to read any event information you have access to.'
    client_credentials:
      status: true
      description: 'Allow the application to read any event information on the platform.'

# @todo Remove after multiple permissions are implemented.
"internal:event:update":
  parent: event:write
  description: 'Temporary scope should be removed once multiple permissions are implemented.'
  umbrella: false
  granularity: permission
  permission: 'edit any event content'
  grant_types:
    authorization_code:
      status: true
      description: 'Allow the application to update events on the platform.'
    client_credentials:
      status: true
      description: 'Allow the application to update events on the platform.'

"internal:event:delete":
  parent: event:write
  description: 'Temporary scope should be removed once multiple permissions are implemented.'
  umbrella: false
  granularity: permission
  permission: 'delete any event content'
  grant_types:
    authorization_code:
      status: true
      description: 'Allow the application to delete events on the platform.'
    client_credentials:
      status: true
      description: 'Allow the application to delete events on the platform.'

"internal:event:text_format":
  parent: event:write
  description: 'Temporary scope should be removed once multiple permissions are implemented.'
  umbrella: false
  granularity: permission
  permission: 'use text format basic_html'
  grant_types:
    authorization_code:
      status: true
      description: 'Ensures that body fields can be filled with basic_html text.'
    client_credentials:
      status: true
      description: 'Ensures that body fields can be filled with basic_html text.'

"internal:event:social_tagging":
  parent: event:read
  description: 'Temporary scope should be removed once multiple permissions are implemented.'
  umbrella: false
  granularity: permission
  permission: 'view terms in social_tagging'
  grant_types:
    authorization_code:
      status: true
      description: 'Allow the application to view terms from social_tagging taxonomy you have access to.'
    client_credentials:
      status: true
      description: 'Allow the application to view terms from social_tagging taxonomy on the platform.'
