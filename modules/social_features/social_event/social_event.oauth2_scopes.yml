# Event scopes for GraphQL API access
"event":
  description: 'Provides access to all Event data on the platform.'
  umbrella: true
  grant_types:
    authorization_code:
      status: true
      description: 'Allow the application to read, write and delete any Event information you have access to.'
    client_credentials:
      status: true
      description: 'Allow the application to read, write and delete any Event information on the platform.'

"event:write":
  parent: event
  description: 'Provides the ability to create, update and delete events on the platform.'
  umbrella: false
  granularity: permissions
  permissions:
    - scope: drupal
      permission: 'access content'
    - scope: drupal
      permission: 'create event content'
    - scope: drupal
      permission: 'edit any event content'
    - scope: drupal
      permission: 'delete any event content'
    - scope: outsider
      identifier: flexible_group
      permission: 'create group_node:event entity'
    - scope: outsider
      identifier: flexible_group
      permission: 'create group_node:event relationship'
    - scope: drupal
      permission: 'use text format basic_html'
    - scope: drupal
      permission: 'view terms in event_types'
    - scope: drupal
      permission: 'select terms in event_types'
    - scope: drupal
      permission: 'view terms in social_tagging'
    - scope: drupal
      permission: 'select terms in social_tagging'
  grant_types:
    authorization_code:
      status: true
      description: 'Allow the application to read, write and delete any Event information you have access to.'
    client_credentials:
      status: true
      description: 'Allow the application to read, write and delete any Event information on the platform.'

"event:read":
  parent: event:write
  description: 'Provides the ability to read events on the platform.'
  umbrella: false
  granularity: permissions
  permissions:
    - scope: drupal
      permission: 'access content'
    - scope: drupal
      permission: 'view terms in social_tagging'
    - scope: drupal
      permission: 'view terms in event_types'
  grant_types:
    authorization_code:
      status: true
      description: 'Allow the application to read any event information you have access to.'
    client_credentials:
      status: true
      description: 'Allow the application to read any event information on the platform.'
