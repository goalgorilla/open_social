__global_actions:
  import_configs:
    - field.storage.node.field_event_online
    - field.field.node.event.field_event_online

core.entity_form_display.node.event.default:
  expected_config: { }
  update_actions:
    change:
      third_party_settings:
        change:
          third_party_settings:
            field_group:
              group_date_time:
                label: 'Date and time'
                parent_name: 'group_event_schedule'
                region: content
    add:
      third_party_settings:
        field_group:
          group_event_schedule:
            children:
              - group_date_time
              - field_event_online
            format_settings:
              classes: ''
              description: ''
              id: ''
              label_as_html: false
              required_fields: false
              show_empty_fields: false
            format_type: fieldset
            label: Schedule
            parent_name: ''
            region: content
            weight: 1
      content:
        field_event_online:
          type: boolean_checkbox
          weight: 128
          region: content
          settings:
            display_label: true
          third_party_settings: { }

