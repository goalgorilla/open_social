core.entity_form_display.node.event.default:
  expected_config: { }
  update_actions:
    change:
      third_party_settings:
        change:
          third_party_settings:
            field_group:
              group_date_time:
                label: 'Date and time'
                parent_name: 'group_event_schedule'
                region: content
    add:
      third_party_settings:
        field_group:
          group_event_schedule:
            children:
              - field_event_meeting
              - group_date_time
            label: Schedule
            region: content
            parent_name: ''
            weight: 2
            format_type: fieldset
            format_settings:
              classes: ''
              show_empty_fields: false
              id: ''
              label_as_html: false
              description: ''
              required_fields: false
      content:
        field_event_meeting:
          type: event_meeting
          weight: 129
          region: content
          settings: { }
          third_party_settings: { }

