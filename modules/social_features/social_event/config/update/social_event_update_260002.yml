core.entity_form_display.node.event.default:
  expected_config: { }
  update_actions:
    delete:
      third_party_settings:
        field_group:
          group_enrollment:
            children:
              - group_enrollment_methods
              - field_event_enroll
      hidden:
        field_external_registration: true
        field_event_registration_url: true
    add:
      dependencies:
        config:
          - field.field.node.event.field_external_registration
          - field.field.node.event.field_event_registration_url
        module:
          - link
      third_party_settings:
        field_group:
          group_enrollment:
            children:
              - field_external_registration
              - field_event_registration_url
              - group_enrollment_methods
              - field_event_enroll
      content:
        field_external_registration:
          type: boolean_checkbox
          weight: 17
          region: content
          settings:
            display_label: true
          third_party_settings: { }
        field_event_registration_url:
          type: link_default
          weight: 18
          region: content
          settings:
            placeholder_url: 'https://'
            placeholder_title: ''
          third_party_settings: { }

