social_event.settings:
  type: config_object
  label: 'Social Event Settings'
  mapping:
    enroll:
      type: sequence
      label: 'For which group type a user should be added to the group when enrolling for an event.'
      group_type:
        type: string
        label: 'Group Type'
    disable_event_enroll:
      type: boolean
      label: 'Disable all event enrollments on your community'
    show_user_timezone:
      type: boolean
      label: 'Show user timezone'
    online_meeting:
      type: mapping
      label: 'Online Meetings Settings'
      mapping:
        default_meeting_type:
          type: string
          label: 'Default meeting type'
        max_attendees:
          type: integer
          label: 'Default maximum attendees'
    langcode:
      type: string
      label: 'Language code'

views.sort.social_event_date_sort:
  type: views_sort
  label: 'Date sort'
  mapping:
    granularity:
      type: string
      label: 'Granularity'

views.filter.social_event_date_filter:
  type: views_filter
  label: 'IN operator'
  mapping:
    expose:
      type: mapping
      label: 'Expose'
      mapping:
        reduce:
          type: boolean
          label: 'Reduce'

views.filter.social_event_is_online:
  type: views_filter
  label: 'Is online event'
  mapping:
    value:
      type: boolean
      label: 'Value'
