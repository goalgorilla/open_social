langcode: en
status: true
dependencies:
  module:
    - activity_logger
    - social_event_managers
  enforced:
    module:
      - social_event
third_party_settings:
  activity_logger:
    activity_bundle_entities:
      event_enrollment-event_enrollment: event_enrollment-event_enrollment
    activity_action: create_entitiy_action
    activity_context: owner_event_enrollment_activity_context
    activity_destinations:
      email: email
    activity_create_direct: true
    activity_aggregate: false
    activity_entity_condition: event_online_enrollment_condition
    email_subject: 'You’ve enrolled for an online event'
template: enrolled_to_online_event
label: 'A user was enrolled for the online event'
description: 'A user was enrolled for the online event'
text:
  -
    value: "<p>Congratulations! You are now enrolled in the event <em>[social_event:event_iam_organizing]</em>.You can enter the meeting by using ‘Join now’ button which appears 10 minutes before start time. The meeting might be recorded. For more information view this event in your community.</p>\r\n\r\n<p>[message:cta_button]</p>\r\n"
    format: full_html
settings:
  'token options':
    clear: false
    'token replace': true
  purge_override: false
  purge_methods: {  }
