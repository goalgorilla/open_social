channels:
  userCreate:
    address: com.getopensocial.cms.user.v1
    messages:
      userCreate:
        payload:
          allOf:
            - $ref: '#/components/schemas/cloudEventsSchema'
            - type: object
              properties:
                type:
                  type: string
                  const: com.getopensocial.cms.user.create
                data:
                  type: object
                  properties:
                    user:
                      type: object
                      properties:
                        id:
                          type: string
                          description: The UUID of the user.
                        created:
                          type: string
                          format: date-time
                          description: The creation time of the user.
                        updated:
                          type: string
                          format: date-time
                          description: The last updated time of the user.
                        status:
                          type: string
                          description: The status of the user.
                          enum:
                            - active
                            - blocked
                        displayName:
                          type: string
                          description: The display name of the user.
                        firstName:
                          type: string
                          nullable: true
                          description: The first name of the user.
                        lastName:
                          type: string
                          nullable: true
                          description: The last name of the user.
                        email:
                          type: string
                          format: email
                          description: The email address of the user.
                        roles:
                          type: array
                          items:
                            type: string
                          description: Roles assigned to the user.
                        timezone:
                          type: string
                          description: The timezone of the user.
                        language:
                          type: string
                          description: The preferred language of the user.
                        address:
                          allOf:
                            - $ref: '#/components/schemas/Common.Address'
                          nullable: true
                          description: The user address.
                        phone:
                          type: string
                          nullable: true
                          description: The phone number of the user.
                        function:
                          type: string
                          nullable: true
                          description: The job function of the user.
                        organization:
                          type: string
                          nullable: true
                          description: The organization of the user.
                        href:
                          $ref: '#/components/schemas/Common.Href'
                    actor:
                      $ref: '#/components/schemas/Common.Actor'
